name: Verify web research release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/target
          key: kraken-rust-1.98-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'scripts/build-native.cjs') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake ninja-build
      - run: npm ci
      - name: Configure reproducible Rust paths
        run: node -e "const fs=require('node:fs'),os=require('node:os');const flags=['--remap-path-prefix='+process.cwd()+'=/n2-kraken','--remap-path-prefix='+os.homedir()+'=/build-home'];if(process.platform==='win32')flags.push('-Ctarget-feature=+crt-static');fs.appendFileSync(process.env.GITHUB_ENV,'CARGO_ENCODED_RUSTFLAGS='+flags.join(String.fromCharCode(31))+'\n');"
      - run: npm run build:native
      - run: cargo +1.98.0 test --manifest-path native/Cargo.toml --release --locked --all-targets -j 2 ${{ runner.os == 'Windows' && '--target x86_64-pc-windows-msvc' || '' }}
      - run: cargo +1.98.0 test --manifest-path native/Cargo.toml --release --locked --no-default-features --all-targets -j 2 ${{ runner.os == 'Windows' && '--target x86_64-pc-windows-msvc' || '' }}
      - run: cargo +1.98.0 clippy --manifest-path native/Cargo.toml --release --locked --all-targets -j 2 ${{ runner.os == 'Windows' && '--target x86_64-pc-windows-msvc' || '' }} -- -D warnings
      - run: cargo +1.98.0 fmt --manifest-path native/Cargo.toml --check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=low
      - if: runner.os == 'Linux'
        run: cargo +1.98.0 install cargo-audit --version 0.22.2 --locked -j 2
      - if: runner.os == 'Linux'
        run: cargo audit --file native/Cargo.lock --deny warnings
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kraken-native-${{ runner.os }}-${{ runner.arch }}
          path: bin/*
          if-no-files-found: error
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kraken-native-*
          merge-multiple: true
          path: bin
      - run: chmod 755 bin/*
      - run: mkdir release && npm pack --pack-destination release
      - name: Check packaged native permissions
        run: python scripts/inspect-package.py release/n2-kraken-1.0.0.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kraken-package
          path: release/*.tgz
          if-no-files-found: error
  installed-consumer:
    needs: package
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kraken-package
          path: release
      - run: node -e "const fs=require('node:fs');fs.mkdirSync('consumer');fs.writeFileSync('consumer/package.json',JSON.stringify({name:'kraken-consumer',version:'1.0.0',private:true}));"
      - run: npm install --no-fund ../release/n2-kraken-1.0.0.tgz typescript@5.9.3 @types/node@22.19.15
        working-directory: consumer
      - run: node -e "require('node:fs').cpSync('tests','consumer/node_modules/n2-kraken/tests',{recursive:true});"
      - run: node --test --test-timeout=45000 node_modules/n2-kraken/tests/*.test.cjs
        working-directory: consumer
      - run: npm exec --offline -- tsc --noEmit --module Node16 --moduleResolution Node16 --target ES2022 --strict --noUncheckedIndexedAccess --esModuleInterop node_modules/n2-kraken/tests/types/consumer.ts
        working-directory: consumer
      - run: npm exec --offline -- n2-kraken --version
        working-directory: consumer
      - run: node --input-type=module -e "import {Kraken} from 'n2-kraken';const engine=new Kraken({dbPath:':memory:',project:'esm',agent:'reader'});await engine.close();"
        working-directory: consumer
      - run: npm audit --omit=dev --audit-level=low
        working-directory: consumer
